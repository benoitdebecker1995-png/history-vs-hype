    <rect x="1320" y="862" width="438" height="56" rx="6" fill="#263A55"/>
    <text x="1539" y="900" text-anchor="middle" fill="#FFFFFF" font-size="23" letter-spacing="2">HISTORY vs HYPE · EXHIBIT</text>
