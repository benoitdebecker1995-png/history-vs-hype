  <rect x="1270" y="70" width="560" height="900" rx="8" fill="#14243A"/>
  <rect x="1270" y="70" width="12" height="900" fill="#D2A23A"/>
  <g font-family="Arial, sans-serif">
    <text x="1320" y="138" fill="#D2A23A" font-size="22" letter-spacing="3">SOURCE STATUS</text>
    <text x="1320" y="184" fill="#FFFFFF" font-size="31" font-weight="700">PRIMARY-GROUNDED</text>
