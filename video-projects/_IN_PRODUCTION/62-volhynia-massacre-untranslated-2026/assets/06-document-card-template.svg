<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0A1628"/>
  <rect x="90" y="70" width="1120" height="900" rx="8" fill="#E8DFC9"/>
  <rect x="122" y="102" width="1056" height="836" fill="#D8CEB7" stroke="#B6AA91" stroke-width="3" stroke-dasharray="12 10"/>
