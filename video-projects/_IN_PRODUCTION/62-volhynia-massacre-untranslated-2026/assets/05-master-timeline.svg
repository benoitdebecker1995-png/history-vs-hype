<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0A1628"/>
  <text x="110" y="125" fill="#D2A23A" font-family="Arial, sans-serif" font-size="26" letter-spacing="5">FROM BORDERLAND TO MEMORY LAW</text>
  <text x="110" y="195" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="60" font-weight="700">The timeline the argument needs</text>
  <line x1="150" y1="540" x2="1770" y2="540" stroke="#536174" stroke-width="8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(190 0)"><circle cx="0" cy="540" r="24" fill="#D2A23A"/><text x="0" y="470" fill="#FFFFFF" font-size="38" font-weight="700">1939</text><text x="0" y="620" fill="#C9D2DC" font-size="25">Volhynian</text><text x="0" y="652" fill="#C9D2DC" font-size="25">Voivodeship</text></g>
    <g transform="translate(490 0)"><circle cx="0" cy="540" r="24" fill="#D2A23A"/><text x="0" y="470" fill="#FFFFFF" font-size="38" font-weight="700">1941</text><text x="0" y="620" fill="#C9D2DC" font-size="25">Act of restoration</text><text x="0" y="652" fill="#C9D2DC" font-size="25">signed by Stetsko</text></g>
    <g transform="translate(790 0)"><circle cx="0" cy="540" r="30" fill="#C84A46"/><text x="0" y="462" fill="#FFFFFF" font-size="42" font-weight="700">1943</text><text x="0" y="620" fill="#FFFFFF" font-size="27" font-weight="700">Mass campaign</text><text x="0" y="654" fill="#FFFFFF" font-size="27" font-weight="700">in Volhynia</text></g>
    <g transform="translate(1090 0)"><circle cx="0" cy="540" r="24" fill="#D2A23A"/><text x="0" y="470" fill="#FFFFFF" font-size="38" font-weight="700">1945</text><text x="0" y="620" fill="#C9D2DC" font-size="25">Soviet interrogation</text><text x="0" y="652" fill="#C9D2DC" font-size="25">records</text></g>
    <g transform="translate(1390 0)"><circle cx="0" cy="540" r="24" fill="#D2A23A"/><text x="0" y="470" fill="#FFFFFF" font-size="38" font-weight="700">2015</text><text x="0" y="620" fill="#C9D2DC" font-size="25">Ukraine’s legal</text><text x="0" y="652" fill="#C9D2DC" font-size="25">memory framework</text></g>
    <g transform="translate(1690 0)"><circle cx="0" cy="540" r="30" fill="#5A7BA3"/><text x="0" y="462" fill="#FFFFFF" font-size="42" font-weight="700">2026</text><text x="0" y="620" fill="#FFFFFF" font-size="27" font-weight="700">Heroes decree</text><text x="0" y="654" fill="#FFFFFF" font-size="27" font-weight="700">and Polish revocation</text></g>
  </g>
  <text x="110" y="936" fill="#9EB0C5" font-family="Arial, sans-serif" font-size="24">Animate one date at a time. Dates identify documentary stages; they do not imply a single uninterrupted policy.</text>
</svg>
