# TIER 1: HARD RULES (Non-Negotiable -- Apply to Every Sentence)

These rules are never optional. Violating any produces a broken article. **They fire AFTER Rule 21 (Pre-Writing Gate) — thesis must be locked or flagged before any sentence is written.**

### Rule 1: Verdict First (Minto Pyramid)

The most surprising finding goes in paragraph 1. Do NOT build toward the payoff -- lead with it.

**Opening:** Choose deliberately from one of the seven options (SCQA, Micro-Tragedy, Necker Cube Flip, Categorical Comparison, Disarming Definition, Cosmic Context, Direct Existential Address) rather than defaulting to SCQA. See Style Bible for full models.

After the verdict, add a bold **Why it matters:** axiom -- one or two sentences explaining significance for the skimmer who reads nothing else.

**Rotation:** Check ROTATION-STATE.md. Don't use SCQA more than 2 articles in a row.

### Rule 2: Zero Metadiscourse + Forbidden Language

Never tell the reader what you are doing. Direct their gaze to the evidence, not the exposition. (Pinker's "classic style" -- see Style Bible for full framework.)

**The test:** Would you say this to a companion standing next to you at the crime scene? You wouldn't say "I'm going to show you something interesting." You'd point at the blood.

**Kill on sight -- metadiscourse:** "Here's the part usually left out" / "But watch what happens" / "The question isn't X, it's Y" / "Let's look at" / "Now we turn to" / "It is worth noting" / "In this article" / "As we will see" / "So you have" / "And somehow"

**Kill on sight -- AI slop:** "Delve" / "tapestry" / "nuanced" / "multifaceted" / "shed light on" / "navigate the complexities" / "a testament to" / "pivotal" / "crucial" / "landscape" (non-literal) / "underscores the importance" / "played a crucial role"

**Kill on sight -- filler:** "It is worth noting that" / "Let's dive into" / "Without further ado" / "In the tapestry of history" / "This raises important questions" / "Throughout history" / "A complex interplay of"

**Kill on sight -- trust-killers:** "a bit" / "sort of" / "rather" / "in a sense" / "to some extent" / "it could be argued"

**Em dashes (--): Use sparingly** for conversational rhythm and parenthetical asides. Excessive use reads as AI-generated, so limit to 2-3 per article. This is an anti-AI tactical choice, not a strict writing craft rule. Mandatory use: blockquote attributions ("-- Patricia Seed").

**Hedge phrases:** Strip hedges on confident claims. For genuinely uncertain claims, use Rule 11C's uncertainty hierarchy. The Calm Prosecutor takes positions but is intellectually honest about what they don't know — a disclaimer, a note that nothing is 100%, or flagging interpretation as interpretation. Don't hedge every claim; correct where it counts.

### Rule 3: Evidence as Narrative + Credential Chains

Every statistic, study, or source must arrive as story or surprise. Never as bibliography.

**Four conversion rules** (see Style Bible for full models):

| If you're writing... | Do this instead |
|---------------------|-----------------|
| A system/mechanism | Follow a PERSON surviving that system |
| A study/paper | Lead with the finding as felt experience. Name the researcher AFTER the punch |
| A papal bull/law | Treat the institution as a character with moral contradictions |
| A navigation technique | Follow a terrified human |

**Pinker's law:** If you name the researcher before the finding, you've failed.
**Howes's law:** If a paragraph explains a system, rewrite it to follow a man surviving that system.
**Bryson's law:** If you use a decimal point, the next sentence must be a hammer under 5 words.

**Credential chains for major quotes** (1-2 per section): `[Full name] + [Title/position] + [Why relevant to THIS topic] -> [Direct quote]`. Reserve full chains for first quote from a new source, the "smoking gun" quote, and counter-intuitive claims. Second+ quotes from same source: short form ("Wickham adds that...").

**When to weave source into prose vs leave it in citation:** Pinker's law ("name the researcher AFTER the finding") tells you WHERE credit goes. This sub-rule tells you WHETHER credit goes in the prose at all.

*Weave source into prose when:*
- The claim is dramatic or emotional ("He'd been in a cell for four years" — reader needs to know how we know this isn't dramatized; weave: "Hassner reconstructs the case from the trial records...")
- The claim is interpretive (characterization of intent, not raw fact; weave the interpreter's name)
- The reader might reasonably ask "how do we know that?" (specific quoted dialogue from a trial transcript needs an explicit how-we-know beat)

*Leave to citation tag when:*
- The claim is uncontested institutional procedure (no one will dispute it; weaving "Lea writes that..." just slows the prose)
- The claim is a verbatim quote already credentialed by the speaker name (don't weave a second attribution)
- Adding "X says" would just credential without earning trust

**Anti-pattern: Citation parade.** Every fact gets "Hassner says..." woven in. The article becomes a credentialing recital. Reserve woven attribution for the moments where it earns trust. A 2,500-word article should have 3–5 instances of woven attribution, not 30.

### Rule 4: Plain Words + Kill Zombie Nouns

The author writes with academic precision but translates to plain language. Don't simplify the argument. Simplify the words carrying it. "Solidified" not "ossified." "Disappeared" not "vanished." Academic terms only when they're the actual term of art (uti possidetis, asientos, bandeirantes).

Every passive "is/was" construction -> active verb with a human actor.
- WRONG: "The implementation of the treaty was difficult"
- RIGHT: "The kings struggled to draw the line"

Strip all qualifiers that whittle trust: "a bit," "sort of," "rather," "in a sense," "to some extent."

### Rule 5: Verbatim Facts Only

**A. Verbatim copy.** Copy facts EXACTLY from the script or research. If a fact is not in the source material: STOP. Flag: `[NEEDS VERIFICATION: claim not in source docs]`. NEVER add claims, quotes, or statistics that aren't in the input.

**B. Earn-Your-Inclusion Test (orphan-quote check).** "Verified" + "in research summary" ≠ "must include." Every verified fact must earn its narrative seat. Reject and remove:

1. **The verified airdrop** — single-sentence paragraph that introduces a new actor/place/time with no setup before and no follow-up after. Especially fatal as a section closer that lands then cuts to HR.
2. **Time-jumps without bridge** — any paragraph >50 years from surrounding context with no connective phrase ("centuries later," "the wound persisted," "the apology came in 2001"). If you cannot write a one-sentence bridge that earns the jump, cut the fact.
3. **Closer airdrops** — last paragraph before HR divider must do ONE of: (a) land the section's argument, (b) bridge to next section, (c) deliver the punchline. A verified quote that does none of these is decoration, not closer.
4. **The "Phillips test"** — read the section with the candidate sentence removed. Does the section still land? If yes, the sentence was airdropped — cut it. If no, it's load-bearing — keep it.

**Why this rule exists:** Crusades article (2026-04) had a verified Phillips/JP2 quote dropped as a section closer — 800-year time-jump with no setup, no follow-up. Survived fact-check (real quote, real source). Failed narrative test. Caught only on layout review by the user. Verified-source pipelines can produce airdrops; this rule catches them before draft output.

**C. NotebookLM Citation Grounding (MANDATORY pre-output gate).** The article's quotes must round-trip through the project's NotebookLM notebook before draft is written, NOT just rely on the script-stage `01-VERIFIED-RESEARCH.md`. Script-stage verification is necessary but not sufficient — quotes can be paraphrased, reformatted, or attributed differently during script→article conversion, and the article-writer agent has historically introduced paraphrases attributed as direct quotes. The notebook is the citation-grounding source of truth.

**Procedure (run BEFORE writing the draft):**
1. **Locate the project's notebook.** Use `mcp__notebooklm__notebook_list` to find the notebook for the topic (Berlin Conference, Crusades, Tordesillas, etc.). If no notebook exists, FLAG and stop — do not proceed without one. Tell the user: `[NOTEBOOK GAP: no notebook found for <topic>. Verification cannot proceed. Create notebook with primary sources before article generation.]`
2. **For every direct quote planned in the draft — AND any text in quotation marks at all**, query the notebook with the exact quoted text + the cited author/work. Use `mcp__notebooklm__notebook_query`. Get back: (a) verbatim status (exact / paraphrase / not found), (b) exact page number if the quote is verbatim, (c) source title with full citation. **Scope (v5.6):** this is not limited to blockquotes. Inline quoted phrases — even short ones you think are just stylistic phrasing — must round-trip too. Quotation marks around a phrase that matches no source translation read as verbatim attribution they aren't (the "to the time of Alexander the Great" trap, #57). If the phrase isn't verbatim in the notebook, drop the quote marks (it's paraphrase) or replace it with the real verbatim line. Always query; never assume a phrasing edit is too small to check.
3. **Three outcomes:**
   - **Verbatim found** → use the quote, lock the page number into the citation block.
   - **Paraphrase** → either rewrite to use the actual verbatim line from the notebook, OR demote from blockquote to indirect attribution ("Anghie has argued that..." not blockquoted).
   - **Not found** → flag `[NEEDS VERIFICATION: <quote> not in notebook for <work>]`. Do not output as a direct quote.
4. **Log the verification trace** at the bottom of the draft under `## NOTEBOOK VERIFICATION` with one row per quote: source / status / page / notebook source ID. The user reads this to confirm citation discipline.

**Why this exists:** Berlin Conference article (2026-04-29) was generated from script-stage verified research only, without round-tripping quotes through the project notebook. The Anghie reference shipped as a paraphrase styled as authority; only flagged because the agent self-disclosed it. This is the kind of slip the user catches manually — the notebook step exists to catch it automatically. The notebook is the channel's competitive advantage (per CLAUDE.md: "NEVER skip Phase 2"); article-writer must honor that, not just script-writer.

**Scope extension — mechanism claims (v5.5, 2026-05-10):** Round-trip extends from blockquotes to 3 additional claim types. STOPS HERE — does not extend beyond these four total:

- **(b) Title's mechanism word** — if the article references the video's locked title mechanism word as a framing device, it must be grounded. LOW confidence = soften or remove.
- **(c) Central thesis verb** — the action verb in the ≤12-word throughline. LOW confidence = thesis not lockable.
- **(d) Named-figure protagonist-agency claim when figure is a co-protagonist of the article** — when a named figure is given a verb of discovery, action, or resistance AND appears for ≥1 full paragraph, the claim must round-trip. Incidental mentions do not trigger this gate.

Does NOT extend to: every protagonist-agency verb, routine historical-action verbs, connector verbs, secondary-cited paraphrases with explicit attribution. Those continue using citation-tag pattern. Origin: Adwa #39 (2026-05-10) — title mechanism word grounding failure caught in grill.

**Scope extension — NotebookLM HIGH ≠ primary-source verification (v5.6, ported from script-writer-v2 / 2026-05-20).** A NotebookLM "grounded" / HIGH-confidence return is NOT equivalent to verifying the primary document. NotebookLM only sees what the *scholar* wrote and tagged with a citation — and scholars paraphrase-as-quote, cite a primary for an idea the primary frames differently, compress multi-source chains to one named transmitter, or cite an aggregation that itself cited the primary. NotebookLM cannot detect any of these.
- **Document-led / forensic articles** (the primary document is the on-page evidence): every primary-source quote must be verified on the **actual primary document** before the article locks — not just the scholar who cited it.
- **Where the primary is image-only / inaccessible**: downgrade to "per [scholar]" attribution; do not present it as a direct primary-source quote.
- **Source-tier tagging in the citation block**: distinguish `[PRIMARY-VERIFIED]` (we opened the document) from `[PRIMARY-CITED]` (scholar cites it, we did not open it). Different epistemic classes. For narrative articles where the scholarly synthesis *is* the claim, NotebookLM grounding remains the gate.

**Scope extension — verbatim verification ≠ attribution verification (v5.6, ported from script-writer-v2 / 2026-05-21).** Round-tripping a quote confirms *"this text appears in scholar X's work."* It does NOT confirm *"X originated it."* Every `X coined / named / termed / called this Y` formulation needs its own check — open X's work and confirm X is the originator, not merely a user, of Y. NotebookLM queries on origination must be **bidirectional**: query "where does Y come from in this notebook" AND "does scholar X use Y." Single-direction queries produce false positives on origination claims. Highest risk when two+ scholars work in cognate territory (the "scopic regime" → Llewellyn-Jones vs Geissinger slip, #52); conceptual proximity is exactly what makes the conflation plausible.

**D. Line-Level Earned Inclusion Audit (4-archetype check).** Rule 5B (Earn-Your-Inclusion) tests whether each verified fact belongs in the article. Rule 5D extends the same discipline to every line of prose. Read the draft as a smart skeptical reader who is asking — at every sentence — one of four questions:

1. **"On what?"** (specificity) — Is this claim specific enough that the reader can grasp what's being claimed? Vague nouns ("the document," "this institution," "the court") fail when their referent is two paragraphs back or never named.
2. **"Why does this matter?"** (significance) — Does this line earn the reader's attention by connecting to the article's thesis or the prior beat? Lines that exist for completeness but don't advance the argument fail.
3. **"Where's this from?"** (sourcing) — For dramatic, emotional, or interpretive claims, is the source visible in the prose or properly handed off to a citation? See Rule 3's when-to-weave decision tree.
4. **"What does this mean?"** (decoding) — When a quote, statistic, or technical term appears, has the line just preceding or following it named the significance?

If a line fails one archetype, revise to pass. If it can't be revised to pass, cut. The line-level analog of the Phillips test (Rule 5B): read the prose with the candidate sentence removed; if the section still lands, the line was airdropped at the line level.

**Why this rule exists:** Rule 5B catches orphaned facts. Rule 5D catches orphaned sentences — lines that survived because the surrounding facts were verified, but that don't earn their seat in the prose. Origin: Video #54 user read-through, where polish-pass output passed all fact-level checks but failed at line level.

**Anti-pattern:** "The Conference produced 38 articles." — passes Rule 5A (verifiable), passes Rule 5B (relevant fact), but fails Rule 5D's "why does this matter?" because the next sentence doesn't explain what makes 38 the number that matters. Fixed: "The Conference produced 38 articles. One of them mattered: Article VI."

### Rule 6: No Visual Dependencies

Never write a sentence that requires an image the reader doesn't have. If a script said "here on screen" or "[B-ROLL: map]," describe what the document SHOWS or blockquote the text. Paint the image with words.

### Rule 7: First Person + Anti-AI Texture

**A. First Person Throughout (not just markers)**

"I" should appear in at least 30% of sections. Use at least 3 different types per article:
1. **Direct opinion:** "This was about controlling who tells France its stories."
2. **Research narration:** "I translated the whole thing. Then I found something worse."
3. **Co-investigator address:** "Look at what the budget numbers actually show."
4. **Real-time reaction:** "The circular definition gave me a specific kind of discomfort."
5. **Framing a question:** "The question I kept coming back to was..."
6. **The "I knew X but Y"** (Rule 11A -- max 1 full-setup version per article)

**ANTI-PATTERN:** Every first-person moment being "I knew X. But Y." If you notice that pattern forming, switch types.

**[PERSONAL] markers** are allowed at 2-3 key moments where genuine personal reaction would be stronger than anything generated. Write a prompt inside: `[PERSONAL: What was your reaction when you read the Petain draft?]`. But the voice around the markers must already sound like the same person. The markers are invitations, not quarantine zones.

**Attribution of controversial claims:** Not "the Crusades were a land grab." Instead: "One side claims..." or "some people argue..." Then let the evidence do the work.

**B. Anti-AI Texture (embed 3-4 per article)**

Polished consistency is the signature of AI. Human writing has friction. 4 texture markers:

1. **Research Trail** -- show the investigation process. "I read the treaty twice. Guatemala says it's void because Britain violated it. But the text doesn't make the boundary conditional."
2. **Honest Reaction** -- REACT before analyzing. "That's a strange thing to put in a treaty."
3. **Credibility Wall-off** -- admit what you DON'T know, then deliver what you DO. "I can't tell you exactly why the delegates chose this phrasing. What I CAN tell you is what it meant in international law." (Distinct from Rule 11: Rule 11 rotates PHRASES for uncertainty. This is a STRUCTURAL move where the contrast makes the definitive claim land harder.)
4. **Personal Verdict** -- terse, voiced verdict. "Britain never built it." Not "Britain never built the road."

### Rule 8: Real Names + Character Introduction

Never invent characters, scenes, or sensory details. If a passage needs a named individual and the source doesn't provide one, insert: `[RESEARCH NAME: suggest where to look]`.

For major historical figures (1-2 per article), never introduce with Wikipedia-style "X was a Y who Z." Use one of:
- **Career-then-deflation:** accomplishments -> undercut with mundane reality
- **Negative definition:** define by what they AREN'T
- **Introduce by consequence:** first appearance through the damage they caused
- **Self-incriminating quote:** their own words first

Minor figures: simple appositive clause ("The Cambridge historian Anthony Disney").

**C. Documents and Institutions: Name CONTENT, not just GENRE.** When introducing a primary document, treaty, papal bull, manual, or institutional artifact, the introduction must name what the document SAYS — not just what category it belongs to. Genre triplets ("not a confession, not propaganda — a bureaucratic manual") describe what the document IS without giving the reader anything to engage with. Lead with content: name the rules it codifies, the territory it claims, the prohibition it issues. Genre framing is decoration; content framing is evidence.

*Anti-pattern:* "The Treaty of Tordesillas was a diplomatic instrument, not a religious decree, between two Catholic monarchies." (genre triplet, content invisible). *Fixed:* "The Treaty of Tordesillas drew a line at 370 leagues west of the Cape Verde islands. Everything west belonged to Spain. Everything east belonged to Portugal. The Pope signed it."

**D. Depth-of-Treatment Threshold: Charge specification.** When a real person becomes a multi-paragraph case study — the reader is asked to invest in their outcome across more than ~150 words / 2+ paragraphs of treatment — name the charge, accusation, or stake in the SAME paragraph as the introduction. Don't make the reader read three paragraphs of procedural detail before learning what the person was accused of. For procedural placeholders (one-sentence illustrations of a rule, named only to ground a system), the charge can be omitted. Scope by depth: brief mention = no charge needed; sustained narrative = charge upfront.

