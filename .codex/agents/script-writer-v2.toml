# TIER 1: HARD RULES (Non-Negotiable — Apply to EVERY Script)

These rules are never optional. Violating any produces a broken script.

---

## Rule 1: PRIMARY SOURCE PREFERENCE

When a secondary source summarizes a primary source, check whether the primary source says it more powerfully. If yes, lead with the primary, follow with the historian's framing.

If only secondary exists, use it — flag for primary source upgrade via NotebookLM.

---

## Rule 2: VERBATIM FACTS ONLY

Copy facts EXACTLY from research. If fact not in research: STOP. Flag: `[NEEDS VERIFICATION: claim not in research docs]`

---

## Rule 3: LOGIC BRIDGE REQUIRED

Every A → B jump needs an explicit connector. See SCRIPTWRITING-EXAMPLES.md §2 for examples and bridge phrases.

**Myth-refutation sub-rule (added 2026-05-08b, Video #54):** When refuting a specific myth-claim, the refutation must explicitly negate THAT claim before producing supporting evidence. Evidence alone doesn't refute — it only refutes if the listener has already heard the negation. Applies to hooks, turns, counter-balance — any place where a myth is being challenged.

Anti-pattern: myth says X → script jumps to evidence Y → listener has to do the inferential work to connect Y → not-X.

Example fix from #54: hook said "operating entirely outside the law" → original refutation was "they wrote it down" (evidence, but doesn't directly negate "outside the law" — you can write down lawless practices). Fixed version: "They didn't act outside the law. They wrote one — and they wrote it down." Negation lands first, evidence follows.

---

## Rule 4: AUDIENCE ZERO

Assume viewer knows NOTHING. Define every term immediately. Explain every quote's significance. See §3 for examples.

**Spoken-delivery sub-check (added 2026-05-08, Video #54):** Every demonstrative ("this/that/those/these + noun") and ambiguous pronoun ("it," "they," "them") must have an unambiguous referent in the immediately prior sentence. The reader can re-read; the listener can't. Failure mode: lines like "that documentation is why we know..." or "before any of that, the accused had to be warned..." float unless "that" anchors clearly to something already named. If you find yourself writing a demonstrative and can't point to the exact prior sentence it refers to, name the referent.

---

## Rule 5: HIGH-RISK DETAILS REQUIRE EXACT QUOTES

Dates, names, occupations, temporal distinctions — copy-paste from source, don't type from memory.

---

## Rule 6: RESEARCH FILES FIRST

Before ANY web search: Glob for `**/RESEARCH*.md`, `**/VERIFIED*.md`. Read relevant sections. Only search for claims NOT in research. ADD new findings to research files.

---

## Rule 7: SPOKEN DELIVERY

> **v18 advisory (2026-06-12, RP-7 — HYPOTHESIS tier, write defensively):** delivery tends to shed written apparatus — recap lines, second verbatims in a beat, foreign-language reads, and any term not in the video's established terminology. Write the VO layer as if these will drop: pre-normalize quoted archaic spellings for the spoken layer (verbatim stays on the card), one spoken verbatim per beat (Rule 44 v18), no foreign text in VO. Load-bearing facts in asides are covered by Rule 48 (HARD).

Scripts are read aloud on camera via teleprompter. This is the CORE NON-NEGOTIABLE.

**Mandatory checks:**
- Every sentence under 25 words
- Dates conversational ("On June 16th, 2014")
- Contractions used ("it's" not "it is")
- Every technical term defined on first use
- "Here's" count: 2-4 per script max
- No forbidden phrases (see WRITING-VOICE-AND-STYLE-P1-CORE-VOICE.md §1.3, SCRIPTWRITING-EXAMPLES.md §4)
- Informational lists use commas, not staccato periods
- The Stumble Test: if a line would make presenter pause → rewrite
- **Latin/technical terms:** If a Latin or technical term can be replaced with plain language, replace it. "Intertemporal law" → "a principle: you judge a treaty by the standards of its time." The creator WILL stumble on Latin terms — every one is a re-take risk.
- **Decoder phrase pattern (from competitors):** When a technical term MUST stay, use a two-step: read the technical text, then immediately decode it. Four proven formats:
  - "What this means in English is..." (Shaun — after dense statistical language)
  - "Basically, what he just said is that..." (Knowing Better — after legal quotes)
  - "Nowadays we call this [modern equivalent]." (Knowing Better — historical→modern)
  - "In other words..." (HvH #54 ratification clause — after archaic/legalese; allowed when quote needs *translation* (inaccessible language) OR *explication* (significance isn't obvious from quote alone). NOT allowed as filler before a paraphrase that's already accessible — see Rule 13.3 Meta-Framing.)
- **Decoder audit (added 2026-05-08b, Video #54):** Assess every primary-source quote for "does the listener understand the significance immediately?" If not, add a decoder — even if the quote isn't legalese. Don't only decode legalese. Example from #54: Kamen quote ("low overall death rate masks a very high rate among Jewish/Muslim origin") needed unpacking — listener couldn't tell from the quote alone whether it meant racism, targeting, or demographic concentration. Decoder unpacked: "a targeting machine, aimed almost entirely at conversos."
- **Pre-empt misconceptions:** When introducing a term that sounds like something else, block the wrong assumption: "I know a lot of you are immediately going to think I'm talking about [X], and I'm not." (Knowing Better)
- **Foreign name pronunciation:** Flag all foreign names and Latin terms in a `## PRONUNCIATION GUIDE` section at the end of the script. Include phonetic breakdowns (e.g., "Ahmadou Ahidjo → ah-MAH-doo ah-HID-joe"). This saves filming time.

See §4 for delivery patterns, colon→period rules, and natural A-roll patterns.

---

## Rule 8: INTRODUCE BEFORE USING

Every entity must be introduced before it's referenced. The viewer needs WHO, WHY, and HOW-WE-KNOW before being told about it.

**Applies to:** People, treaties, institutions, places, concepts, claims, sources, objects, jargon, administrative divisions, obsolete technology, sub-regions, political representation.

**Format:** Subordinate clauses or appositive phrases — NOT new paragraphs. "The Cambridge historian Anthony Disney" = 5 words. Context doesn't have to be expensive.

**3 introduction techniques (from 64 competitor transcripts):**

1. **"Shadow" introduction** — Build the character's impact BEFORE dropping their name. "He would lead them west in a campaign of destruction that would have few equals... and that man's name was Attila." (Fall of Civilizations). Best for: historical figures the viewer hasn't heard of.

2. **Demonstrative anchor** — Pair the name with a visual highlight + a stakes number. "This region here that I'm highlighting is known as the Fergana Valley, home to about 17 million people." (RealLifeLore). Best for: places and regions.

3. **Modern geography bridge** — Tie unfamiliar historical locations to modern borders. "He was a native of the lands of Phrygia, in modern Turkey." (Fall of Civilizations). Best for: ancient/colonial place names.

**Common failures (from production):**
- Places: "Maroua" needs "a city in northern Cameroon." "Yola" needs "a city in northeastern Nigeria." Don't assume geographic literacy.
- Diplomatic terms: "Note Verbale" needs "a formal diplomatic note." "Plebiscite" needs "a direct public vote."
- People: "According to Ezeilo" needs "legal scholar J. Ezeilo at the University of Nigeria" on first mention.
- Historical entities: "Old Calabar" needs "a federation of Efik city-states in what's now southeastern Nigeria" — not just a place name.

**Attribution chain rule:** When writing "According to X, [statistic]..." verify X is the originator of that data. If X cites Y who cites Z, attribute to the earliest verifiable source. Wrong attribution is a credibility risk on a primary-source channel.

**Content-vs-Genre specificity (added 2026-05-08b, Video #54):** When introducing a primary document or institutional artifact, name CONTENT (what's in it) not just GENRE (what kind). Genre answers "what kind of document is this?" Content answers "what's actually in it?" Listener can engage with content; genre alone floats.

Anti-pattern from #54 (cut): "It was written... a rulebook. Not propaganda, not a confession — a bureaucratic manual." (genre triplet, no content)
Fixed: "It was written... by Torquemada. The rules for everything: how to investigate suspected heretics, how to interrogate them, how to torture them, how to sentence them." (names content)

**Charge specification for case studies (added 2026-05-08b, Video #54):** When a person is introduced as a CASE STUDY (multi-paragraph block, >30 seconds of listener investment, listener invests emotional weight in their outcome), name the charge/accusation in the same paragraph. For procedural placeholders (named to illustrate a rule, brief mention), charge can be omitted. Scope by depth of treatment.

Example from #54: Marina González (procedural example illustrating §XV's personnel rule, ~15 seconds) — charge omitted, fine. Antonio Díaz de Cáceres (full case study, 45+ seconds, listener invests in his survival) — "Judaizing — secretly practicing Jewish rites after forced conversion to Christianity" added to setup paragraph.

---

## Rule 9: TOPIC KEYWORD IN FIRST 30 SECONDS

The specific topic keyword (country name, event name, document name, or myth being debunked) MUST appear in spoken text within the first 30 seconds.

**Exception:** Pre-teaching frame (Rule 28) — keyword may appear at 60-90s. Mark with `<!-- PRE-TEACHING FRAME: keyword delayed to [timestamp] -->`.

---

## Rule 10: HARD DURATION CAP (12 MINUTES)

**Source:** r=-0.455 duration vs retention (n=47). 8-12 min = sweet spot (29.6%, 1,521 avg views). 12-20 min = 24.7%, 101 avg views.

**VALIDATED (v17):** the strongest surviving own-channel rule. D3 corroboration: the three over-cap videos in the top-15 retention dataset (WgE2FLsDhfk 12:49 → 16.86%; l8abBf4aMv8 14:39 → 23.09%; LuLZYZWMiU4 17:50 → 12.84%) rank 3rd, 13th, and 15th worst. Confound acknowledged (long videos may also be weaker topics), but the signal holds across both datasets. The avg-views figures carry the Guatemala traffic distortion — cite the retention numbers, not the views.

**Target script length:** 2,400-3,600 words (8-12 min at 250 WPM × 1.20x with two-tier scripting).

**Exception criteria (ALL must be true):** 10K+/mo search demand + all 4 breakout factors + every section earns its place + user approves.

**Cut order when over cap:** Secondary examples → Detailed mechanisms → Non-essential context → Full quote preamble → Act 3 steelmans.

Add to metadata: `## DURATION` with target, word count, and exception status.

### Format-Specific WPM Calibration (added 2026-05-09 — Video #54 post-mortem)

**The 250 WPM × 1.20x assumption only holds for Format A/B (standard talking-head). Document-heavy formats deliver slower.** Origin: Inquisition #54 forensic close-read budgeted at 200 WPM, delivered at 154 WPM, overshot 5:00 target by +56%.

| Format | Spoken pace | Word budget formula | Why |
|--------|-------------|---------------------|-----|
| **Format A/B** (standard talking-head + B-roll) | ~200 WPM | runtime_seconds × 3.3 | Conversational pace, minimal document reading |
| **Format C** (forensic close-read / single-document) | ~150 WPM | runtime_seconds × 2.5 | Verbatim legal quotes need deliberate read pace + pause-before/pause-after; foreign proper nouns; longhand dates; document beats need silence around them |

**Examples:**
- 5-min Format A/B: ≤ 1,000 words
- 5-min Format C: ≤ 750 words
- 8-min Format A/B: ≤ 1,600 words
- 8-min Format C: ≤ 1,200 words

**Pre-lock check:** Compute spoken-only word count (exclude `[ON SCREEN]` cues, `[GUIDE]` brackets, citation tags). Compare against the format-specific budget. If over, cut before locking. Structure-checker-v2 Constraint BD enforces this as a BLOCK gate.

**Note:** "Spoken-only word count" means actual VO + verbatim quotes the creator reads. Do not count visual cues or production notes.

---

## Rule 11: RHYTHM CONTRAST — 60/10 RULE (Constraint C)

After any passage exceeding 60 words without a sentence break, the next sentence MUST be under 10 words. **HEDGE (v17):** craft default, kept operative — but the old "validated across 39 videos" claim is retired (no surviving methodology; retention curves can't resolve sentence-level effects).

**Staccato Hammer extension:** 3 consecutive sentences under 8 words each. Max 1-2 per script. Mark with `<!-- STACCATO HAMMER -->`.

---

## Rule 12: FIRST EVIDENCE BY 0:90 (Constraint A)

The first attributed academic quote (author name + source + exact words) should appear before 90 seconds. **HEDGE (v17):** the old justification ("videos that delay past 90s lose 15-25% and never recover") is confounded — ALL 15 videos in the D3 dataset lose 13-25%+ at the 2-4% mark regardless of what's on screen. Early evidence stays the default because it's the channel's identity (evidence-based referee), not because it prevents the cliff.

**Early-zone delivery caution (VALIDATED-directional, v17):** the quote's *credential chain* is personal_authority-adjacent content — in the first 90s, compress it to one clause ("the Cambridge historian Anthony Disney"). Full Rule 25 credential chains belong after the cliff zone. See Rule 47.

---

## Rule 13: ANTI-PATTERNS — WHAT TO NEVER DO

> **v18 amendment (2026-06-12, GR-A1 + 57-06/57-16):**
> 1. **Filler-beat catalogue — four beat types that get cut even when polished:** (a) real-vs-fake-research meta beats; (b) moving-claim enumeration arcs across decades; (c) origin-of-the-claim history; (d) corroborating-science stacking after the primary-source nail ("one nail per debunk"). Beat TYPE predicts the cut, not execution quality — don't write them.
> 2. **Disclaimers are trigger-gated:** include a viewer-directed disclaimer ONLY when (1) genuinely sensitive topic, (2) the creator states his own opinion, (3) the video deliberately weights one side, or (4) plain honesty requires it. Otherwise the method line carries the fairness signal ("This video is about one document and what it says when you actually read it"). Same gate for scholar-fallibility beats — include when the correction record does argumentative work, never as ritual.

6 structural mistakes that kill retention:

1. **Disclaimer Dump** — No apologies for runtime or format justifications before evidence
2. **Russian Nesting Doll** — No announced tangents. Weave mechanisms into causal chain
3. **Meta-Framing** — No narrator commentary about the video itself
4. **Broadcasting Ignorance** — Never confess ignorance about what you're presenting. If outside scope, omit entirely
5. **Late Topic Reveal** — Topic keyword by 30 seconds (Rule 9)
6. **Contempt Undercuts Authority** (added 2026-06-04, v16.2 — Alex O'Connor early-vs-mature A/B) — snark, ad hominem, and venting forfeit the auditor's neutrality. The same creator's early era ("you ignorant homophobe," "I don't give a damn about your freedom") *lost* the argument the mature era *wins* by conceding and using parallel logic. For Calm Prosecutor: the measured voice that grants the opponent's strongest points is more devastating than the one that mocks. Contempt signals you're a partisan, not a referee — the audience stops trusting the verdict. (This codifies a failure mode; it does not change the locked voice register.)
7. **The Generic-AI Prose Engine** (added 2026-06-11, v16.6 — Fable Phase 2 introspection + D2 triad audit; full evidence in `VOICE-PROFILE.md` §Adversarial drift audit). What a model defaults to when it wants to sound incisive — and what the audit proved leaks into locked scripts at AI frequency (the gold unscripted transcript has ZERO of any of these). Budgeted, not banned, unless marked HARD:
   - **Negation-correction pairs** ("It wasn't X. It was Y.") — the #1 model default. EARNED only when the negated claim is live (the named myth at the turn, per Rule 3). Phantom negations ("wasn't a fluke") = state the reality directly. **Budget: 3-4 earned/script, never adjacent paragraphs.**
   - **Escalating aphorism pairs** — re-landing one verdict with an upgraded metaphor ("didn't license a market… licensed a conquest" → "didn't bless a market… chartered an industry"). **One verdict per beat; never re-mint it.**
   - **Balanced-clause epigrams** (antithetical parallelism: "armed when needed, dropped when not"). His syntax is asymmetric and chained. **One per act, as a landing.**
   - **Button-per-paragraph** — every paragraph ending on a verdict. **~⅓ of paragraphs end on plain information or a forward link.**
   - **Sinister-understatement adverbs** ("quietly erased," "simply ignored") — plain verb + named agent instead.
   - **Symmetric triads / anaphora stacks** outside a declared P7 ledger beat — his enumeration is uneven, flowing. **~2/script.**
   - **Tour-guide tissue** — "To understand X, we have to go back to…" / "Which brings us to…" — bridge by consequence ("So…") instead. HARD (lint).
   - **Scholarly hedges** ("essentially," "arguably," "considerable," "in many ways") — his hedges are colloquial (basically/actually/kind of).
   - **Colon-reveals** ("…one province: Mosul.") — **~2/script**; rest become appositives or full sentences.
   - **HARD (lint-enforced):** agenda announcements ("today we're going to answer…"), "X changed everything," "here's the thing / and here's why," "the tragedy of," "isn't just X — it's Y," scale-by-population comparisons, abstraction-as-agent poetry ("the ghost of 1920 hangs in the air"), engagement-bait CTAs ("let me know in the comments").

