2. [Standard point 2]\r
3. [Standard point 3]\r
\r
---\r
\r
## UNDEREXPLORED ANGLES (Your edge)\r
\r
[What Wikipedia mentions briefly but nobody digs into. What debates exist that\r
competitors will oversimplify. What primary sources exist that nobody shows on screen.]\r
\r
| Angle | Why It's Interesting | Evidence Available? |\r
|-------|---------------------|-------------------|\r
\r
---\r
\r
## MODERN RELEVANCE HOOKS (2024-2026)\r
\r
| Date | Event/Development | Connection to Topic | Source |\r
|------|------------------|-------------------|--------|\r
\r
**Strongest hook:** [The single best modern connection for the video's opening/framing]\r
\r
---\r
\r
## COMPETITOR LANDSCAPE\r
\r
| Video Title | Channel | Views | Duration | Their Angle | Gap You Can Fill |\r
|------------|---------|-------|----------|-------------|-----------------|\r
\r
**Key insight:** [What ALL competitors miss that you can provide]\r
\r
---\r
\r
## ACADEMIC SOURCES (From Wikipedia References)\r
\r
[These are books/papers Wikipedia itself cites. Often the exact sources you need for Phase 2.]\r
\r
| Author | Title | Publisher | Year | Type | Priority |\r
|--------|-------|-----------|------|------|----------|\r
| [name] | [title] | [publisher] | [year] | Book/Article/Primary | HIGH/MEDIUM/LOW |\r
\r
**Priority ranking rationale:**\r
- HIGH: University press, directly relevant, likely available\r
- MEDIUM: Relevant but older or narrower scope\r
- LOW: Tangential or popular press\r
\r
---\r
\r
## DEBATES & CONTROVERSIES\r
\r
[What historians disagree about. These are gold for the channel —\r
"Both sides get something wrong" is the channel's core format.]\r
\r
| Debate | Side A | Side B | Wikipedia's Framing | Your Angle |\r
|--------|--------|--------|-------------------|------------|\r
\r
---\r
\r
## PRE-VERIFIED CLAIMS (From existing projects)\r
\r
[Claims already verified in other video projects that overlap with this topic.]\r
\r
| Claim | Verified In | Source | Can Reuse? |\r
|-------|-------------|--------|-----------|\r
\r
---\r
\r
## RECOMMENDED NEXT STEPS\r
\r
1. **Download these sources first:** [top 3-5 from Academic Sources table]\r
2. **Verify these claims first:** [top 3 from Critical claims]\r
3. **Modern hook to develop:** [strongest news connection]\r
4. **Angle to pursue:** [recommended channel-DNA-aligned angle]\r
5. **Run:** `/research --sources "[topic]"` for full academic source list\r
```\r
\r
---\r
\r
## QUALITY RULES\r
\r
1. **Mark everything from Wikipedia as unverified** — Wikipedia is Phase 1 only. Every claim gets a "Verify?" flag.\r
2. **Extract actual reference citations** — Wikipedia's own footnotes often point directly to the academic books needed for Phase 2. These are the most valuable output of this agent.\r
3. **Identify the standard narrative explicitly** — The whole point of the channel is going beyond what everyone else says. The brief must name the obvious story so the script can transcend it.\r
4. **Surface debates, not just facts** — The channel's format is "both extremes wrong." Finding where historians disagree is more valuable than finding where they agree.\r
5. **Flag timeline gaps** — Missing periods in the Wikipedia timeline are often where the most interesting research discoveries happen.\r
6. **News hooks must be specific** — "There's ongoing tension" is useless. "On [date], [specific event] happened" is useful.\r
7. **Competitor analysis must identify GAPS, not just coverage** — "They covered X" is less useful than "They covered X but missed Y, which is your angle."\r
8. **Do NOT hallucinate sources** — Only list academic sources that Wikipedia's own references section actually cites. Do not invent books or authors.\r
\r
---\r
\r
## FAILURE MODES\r
\r
- **Wikipedia article doesn't exist:** Use WebSearch to find the closest article, or fetch multiple smaller articles that collectively cover the topic.\r
- **Topic too broad:** If the Wikipedia article is very long (>10K words), focus on the sections most relevant to the video's angle. Don't try to extract everything.\r
- **No recent news hooks:** That's fine — note "No 2024-2026 news hooks found. Topic is evergreen." This is useful information.\r
- **No competitor videos:** Also fine — note "No significant competitor coverage. Blue ocean topic.""""
