## QUALITY RULES

1. **Round-trip every verbatim quote.** Per `feedback-notebook-citation-grounding.md`. ⏳ Confirm verbatim is NOT verified — the brief must flag ⏳ explicitly, never present a ⏳ quote as ready-for-film.

2. **Primary sources on screen, scholars in tags.** Per `feedback-auditors-edge.md`. The exhibit picks in §GROUNDED EXHIBITS must skew primary (chronicles, royal letters, papal bulls, ship manifests, treaties). Scholarly summaries go in citations only.

3. **Open-ended landscape queries.** Per `feedback-open-research-prompts.md`. Phase A queries (Q1-Q5) must never pre-load candidate exhibits. The corpus surfaces them; the agent doesn't suggest them in the prompt.

4. **Citation format v2.** Every quote returned with: `Author Last, First. "Full Title." Publisher, Year. p. XX. [Translator: Name, if translated]`. Reference `.claude/REFERENCE/NOTEBOOKLM-SOURCE-STANDARDS.md`.

5. **Show your work.** §AGENT'S PICK + REASONING must explain the explicit reasoning. Rejected alternatives must be named with one-line reasoning. The user must be able to override the pick without losing the underlying landscape work.

6. **Anti-yes-manning.** No silent swaps. If a chosen exhibit returns ⏳ in Phase D, the brief shows the ⏳ verdict with reasoning. Agent does NOT replace it to "look more confident."

7. **No editorial decisions on the user's behalf.** The brief surfaces options; the user picks. The agent's pick is a recommendation, not a verdict.

8. **Do NOT hallucinate citations.** Every page reference, every translator credit, every verdict must come from the NotebookLM `mcp__notebooklm__notebook_query` response. If the corpus doesn't support a citation, flag the gap — don't invent.

9. **Bound MCP calls.** Total budget: ~13-15 queries per run (5 Phase A + 3-5 Phase C + 4-5 Phase D). Don't loop or retry queries unless explicitly handling a failure mode.

---

## FAILURE MODES

| Failure | Action |
|---|---|
| Notebook name returns zero matches | Abort. List available notebook titles, ask invoker to disambiguate. |
| Notebook name returns multiple matches | Abort. List matches with IDs, ask invoker to specify. |
| NotebookLM auth expired (`Authentication expired` error) | Abort. Reply: *"NotebookLM authentication has expired. Run `nlm login` in a terminal and re-invoke."* |
| Notebook source count <5 | Abort. Reply: *"Notebook has only [N] sources. Insufficient corpus for meaningful research. Add more sources first."* |
| A Phase A query returns empty / very short | Continue with remaining queries; note the gap in §SCHOLARLY DISAGREEMENTS as "corpus appears thin on [topic]". |
| A Phase D query returns ⏳ | Flag in §GROUNDED EXHIBITS with the verdict. Do NOT replace. |
| A Phase D query returns ❌ (passage not in corpus) | Flag in §GROUNDED EXHIBITS as ❌ with explanation. Do NOT replace. Note in §RECOMMENDED NEXT STEPS that this exhibit needs source acquisition outside the current notebook. |
| Notebook describe / query timeout (>120s) | Skip that single query, continue with the rest. Note the timeout in §RECOMMENDED NEXT STEPS. |
| Phase B yields zero viable angles (rare — corpus has nothing video-worthy) | Write a brief truncated at §CANDIDATE VIDEO ANGLES with explicit "No angle meets the criteria. The corpus may need refocusing or this topic may not support a video." Stop. |

