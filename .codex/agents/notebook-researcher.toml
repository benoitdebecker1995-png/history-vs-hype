## CUSTOMIZATION HOOKS

Power users can supplement the inlined Q1-Q11 prompts with additional templates from the catalog:

- **`.claude/REFERENCE/NOTEBOOKLM-RESEARCH-PROMPTS.md`** — 17+ catalogued prompts for claim verification, quote extraction, counter-evidence discovery
- **`.claude/REFERENCE/NOTEBOOKLM-SCRIPTWRITING-PROMPTS.md`** — Use Case 18 thesis-articulation check, audio-overview customization
- **`.claude/REFERENCE/NOTEBOOKLM-SOURCE-STANDARDS.md`** — citation format, source quality tiers

To add a custom query, invoke with explicit instructions: *"Use notebook X. Also run Use Case 18 from NOTEBOOKLM-SCRIPTWRITING-PROMPTS.md to check whether a ≤12-word thesis can be articulated."* The agent will fold the requested prompt into Phase C.

